<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="msGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Crescent Moon and Star icon -->
  <g transform="translate(5, 5)">
    <!-- Crescent -->
    <circle cx="20" cy="20" r="18" fill="#EF4444"/>
    <circle cx="25" cy="15" r="14" fill="white" />
    <!-- 14-point star -->
    <polygon points="32,5 34,12 41,12 35,16 37,23 32,19 27,23 29,16 23,12 30,12" 
             fill="url(#yellowGrad)" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- Rays from star -->
    <line x1="32" y1="2" x2="32" y2="5" stroke="#FCD34D" stroke-width="1"/>
    <line x1="32" y1="26" x2="32" y2="29" stroke="#FCD34D" stroke-width="1"/>
    <line x1="17" y1="14" x2="20" y2="14" stroke="#FCD34D" stroke-width="1"/>
    <line x1="44" y1="14" x2="47" y2="14" stroke="#FCD34D" stroke-width="1"/>
  </g>
  
  <!-- AI Circuit pattern -->
  <g transform="translate(50, 8)" opacity="0.3">
    <circle cx="10" cy="10" r="3" fill="#3B82F6"/>
    <circle cx="25" cy="5" r="2" fill="#3B82F6"/>
    <circle cx="25" cy="20" r="2" fill="#3B82F6"/>
    <circle cx="40" cy="10" r="3" fill="#3B82F6"/>
    <line x1="13" y1="10" x2="23" y2="5" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="13" y1="10" x2="23" y2="20" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="27" y1="5" x2="37" y2="10" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="27" y1="20" x2="37" y2="10" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  
  <!-- Text -->
  <text x="55" y="25" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1F2937">
    OpenMAIC
  </text>
  <text x="55" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#DC2626">
    MALAYSIA
  </text>
  <rect x="55" y="30" width="60" height="2" fill="url(#msGradient)" rx="1"/>
</svg>