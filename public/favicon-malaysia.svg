<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)"/>
  
  <!-- AI Circuit pattern background -->
  <g opacity="0.2" stroke="white" stroke-width="1">
    <circle cx="8" cy="16" r="2" fill="none"/>
    <circle cx="24" cy="16" r="2" fill="none"/>
    <circle cx="16" cy="8" r="2" fill="none"/>
    <circle cx="16" cy="24" r="2" fill="none"/>
    <line x1="10" y1="16" x2="14" y2="16"/>
    <line x1="18" y1="16" x2="22" y2="16"/>
    <line x1="16" y1="10" x2="16" y2="14"/>
    <line x1="16" y1="18" x2="16" y2="22"/>
  </g>
  
  <!-- Crescent moon -->
  <ellipse cx="15" cy="16" rx="8" ry="8" fill="none" stroke="white" stroke-width="3"/>
  <ellipse cx="17" cy="14" rx="6" ry="6" fill="url(#bgGrad)"/>
  
  <!-- 14-point star -->
  <polygon points="22,8 23,11 27,11 24,13 25,17 22,15 19,17 20,13 17,11 21,11" 
           fill="url(#starGrad)" stroke="#F59E0B" stroke-width="0.3"/>
</svg>