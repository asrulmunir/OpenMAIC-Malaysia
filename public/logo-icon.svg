<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Circuit pattern -->
  <g opacity="0.3" stroke="white" stroke-width="1" fill="none">
    <circle cx="20" cy="20" r="3"/>
    <circle cx="44" cy="20" r="3"/>
    <circle cx="20" cy="44" r="3"/>
    <circle cx="44" cy="44" r="3"/>
    <circle cx="32" cy="32" r="4"/>
    <line x1="23" y1="20" x2="28" y2="29"/>
    <line x1="41" y1="20" x2="36" y2="29"/>
    <line x1="23" y1="44" x2="28" y2="35"/>
    <line x1="41" y1="44" x2="36" y2="35"/>
  </g>
  
  <!-- White crescent outer -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Yellow crescent (Malaysia) -->
  <path d="M 32,12 A 20,20 0 1,0 32,52 A 16,16 0 1,1 32,12" fill="url(#grad2)"/>
  
  <!-- Star -->
  <polygon points="48,14 49.5,18.5 54,18.5 50.5,21.5 51.5,26 48,23 44.5,26 45.5,21.5 42,18.5 46.5,18.5" 
           fill="white" stroke="#F59E0B" stroke-width="0.5"/>
  
  <!-- AI neural connection -->
  <g stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="28" x2="32" y2="36"/>
    <line x1="28" y1="32" x2="36" y2="32"/>
  </g>
</svg>